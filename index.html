<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Briefing</title>
<meta name="description" content="A short daily rundown of US politics, the economy, tech and foreign affairs.">
<meta name="theme-color" content="#f6f1e9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Briefing">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#f6f1e9; --surface:#fffdf9; --ink:#1d1a17; --muted:#6e675f; --line:#e6dccd;
  --c-politics:#b4432c; --c-economy:#2f6f4e; --c-tech:#4551c4; --c-world:#8a5d0c;
  --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14110f; --surface:#1e1a17; --ink:#f3ece2; --muted:#a39a8e; --line:#332c26;
    --c-politics:#ef8a6f; --c-economy:#6fcf9c; --c-tech:#9ea8ff; --c-world:#e4b45c;
  }
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:640px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}

.top{padding:30px 0 14px}
.eyebrow{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font:600 34px/1.1 var(--serif);letter-spacing:-.01em;margin-top:6px}
.meta{display:flex;align-items:center;justify-content:space-between;margin-top:12px;color:var(--muted);font-size:13px;min-height:30px}
#refresh{font:600 13px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer}
#refresh:disabled{opacity:.5}

.chips{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 0;border-bottom:1px solid var(--line);
  background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:14px;font-weight:550;text-decoration:none}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

#banner{margin-top:14px;padding:10px 13px;border-radius:12px;font-size:13.5px;color:var(--ink);border:1px solid var(--line);background:var(--surface)}
#banner[hidden]{display:none}

section{padding:26px 0 4px;scroll-margin-top:58px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-h h2{font:700 13px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}

.story{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;margin-bottom:12px}
.story h3{font:600 21px/1.22 var(--serif);letter-spacing:-.005em}
.sum{margin-top:8px;font-size:15.5px}
.why{margin-top:12px;padding:11px 13px;border-radius:12px;font-size:14.5px;
  background:var(--bg);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.why b{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.links a{font-size:13.5px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line);color:var(--ink);text-decoration:none}
.links a:active{background:var(--line)}
.empty{color:var(--muted);font-size:14.5px;padding:8px 0 14px}

.skel{height:150px;border-radius:16px;margin:26px 0 0;background:linear-gradient(100deg,var(--line) 30%,var(--surface) 50%,var(--line) 70%);background-size:300% 100%;animation:sh 1.4s infinite linear}
@keyframes sh{from{background-position:100% 0}to{background-position:0 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}html{scroll-behavior:auto}}

footer{margin:28px 0 36px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow" id="date">&nbsp;</div>
    <h1>Your daily briefing</h1>
    <div class="meta"><span id="updated"></span><button id="refresh" type="button">Refresh</button></div>
  </header>
  <nav class="chips" id="chips" aria-label="Sections"></nav>
  <div id="banner" role="status" hidden></div>
  <main id="main">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </main>
  <noscript><p class="empty">This app needs JavaScript to show your briefing.</p></noscript>
  <footer>Summaries are written by AI from the headlines and descriptions that news outlets publish, and can contain mistakes. Open the linked articles for the full story. Sources are a mix of outlets so you can compare how stories are framed.</footer>
</div>

<script>
(() => {
  const ACCENT = {'us-politics':'--c-politics','economy':'--c-economy','tech':'--c-tech','foreign-affairs':'--c-world'};
  const NY = {timeZone:'America/New_York'};
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const safeUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; } catch { return null; } };
  let io = null, lastLoad = 0;

  function banner(text){ const b = $('banner'); b.textContent = text || ''; b.hidden = !text; }

  function render(data, note){
    const main = $('main'), chips = $('chips');
    main.replaceChildren(); chips.replaceChildren();
    if (io) { io.disconnect(); io = null; }

    $('date').textContent = data.date_label || '';
    const gen = data.generated_at ? new Date(data.generated_at) : null;
    const valid = gen && !isNaN(gen);
    $('updated').textContent = valid
      ? 'Updated ' + gen.toLocaleTimeString('en-US', {...NY, hour:'numeric', minute:'2-digit'}) + ' ET'
      : '';

    let msg = note || '';
    if (!msg && data.sample) msg = 'This is sample content. Your first real briefing appears after the first run.';
    else if (!msg && data.ai_summaries === false) msg = 'AI summaries were unavailable today, so you are seeing headlines and links only.';
    else if (!msg && valid && Date.now() - gen > 30 * 3600e3) msg = "This briefing is from " + gen.toLocaleDateString('en-US', {...NY, weekday:'long'}) + ". Today's hasn't arrived yet.";
    banner(msg);

    const sections = [];
    (data.categories || []).forEach(cat => {
      const accent = 'var(' + (ACCENT[cat.key] || '--c-tech') + ')';
      const sec = el('section'); sec.id = cat.key; sec.style.setProperty('--accent', accent);
      const head = el('div', 'sec-h'); head.append(el('h2', null, cat.label)); sec.append(head);

      const stories = cat.stories || [];
      if (!stories.length) sec.append(el('p', 'empty', 'No stories for this section today.'));
      stories.forEach(s => {
        const card = el('article', 'story');
        card.append(el('h3', null, s.headline));
        if (s.summary) card.append(el('p', 'sum', s.summary));
        if (s.why_it_matters) {
          const why = el('div', 'why');
          why.append(el('b', null, 'Why it matters'), document.createTextNode(s.why_it_matters));
          card.append(why);
        }
        const links = el('div', 'links');
        (s.links || []).forEach(l => {
          const href = safeUrl(l.url); if (!href) return;
          const a = el('a', null, 'Read on ' + (l.source || 'source') + ' ↗');
          a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';
          links.append(a);
        });
        if (links.children.length) card.append(links);
        sec.append(card);
      });
      main.append(sec); sections.push(sec);

      const chip = el('a', 'chip'); chip.href = '#' + cat.key; chip.style.setProperty('--accent', accent);
      chip.append(el('i'), document.createTextNode(cat.label));
      chips.append(chip);
    });

    if ('IntersectionObserver' in window) {
      io = new IntersectionObserver(entries => entries.forEach(e => {
        if (e.isIntersecting) chips.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.hash === '#' + e.target.id));
      }), {rootMargin:'-20% 0px -70% 0px'});
      sections.forEach(s => io.observe(s));
    }
  }

  async function load(){
    const btn = $('refresh'); btn.disabled = true; lastLoad = Date.now();
    try {
      const r = await fetch('data/briefing.json?ts=' + Date.now(), {cache:'no-store'});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      try { localStorage.setItem('briefing:last', JSON.stringify(data)); } catch {}
      render(data);
    } catch (err) {
      let cached = null;
      try { cached = JSON.parse(localStorage.getItem('briefing:last')); } catch {}
      if (cached) render(cached, "Can't reach the latest briefing right now, so this is your last saved one.");
      else { $('main').replaceChildren(el('p', 'empty', "Couldn't load your briefing. Check your connection and tap Refresh.")); }
    } finally { btn.disabled = false; }
  }

  $('refresh').addEventListener('click', load);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Date.now() - lastLoad > 10 * 60e3) load();
  });
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  load();
})();
</script>
</body>
</html>
